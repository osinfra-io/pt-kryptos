name: Sandbox Destroy

on:
  workflow_dispatch:

# For reusable workflows, the permissions setting for id-token should be set to write at the
# caller workflow level or in the specific job that calls the reusable workflow.

permissions:
  contents: read
  id-token: write

jobs:
  regional:
    name: "Regional: ${{ matrix.zone }}"
    uses: osinfra-io/pt-techne-opentofu-workflows/.github/workflows/plan-and-apply.yml@66e04fe1c5a017238caf7be3d544a0a66b918dd1 # v0.5.5
    strategy:
      matrix:
        include:
          - zone: us-east1-b
          - zone: us-east4-a
    with:
      checkout_ref: ${{ github.ref }}
      github_environment: "Sandbox: ${{ matrix.zone }}"
      opentofu_kms_encryption_key: projects/pt-corpus-tfc9-sb/locations/us/keyRings/state-encryption/cryptoKeys/default
      opentofu_plan_args: -destroy -var-file=environments/sandbox.tfvars
      opentofu_state_bucket: pt-kryptos-state-sb
      opentofu_version: ${{ vars.OPENTOFU_VERSION }}
      opentofu_workspace: ${{ matrix.zone }}-sandbox
      service_account: pt-kryptos-github@pt-corpus-tfc9-sb.iam.gserviceaccount.com
      working_directory: regional
      workload_identity_provider: projects/190688376851/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc
